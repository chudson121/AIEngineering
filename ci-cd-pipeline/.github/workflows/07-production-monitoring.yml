name: "07 · Production Traces, Latency & Failure Monitoring"

# ──────────────────────────────────────────────────────────────────────────────
# Stage: Continuous production monitoring
# RA Section 8   – Production traces, latency, and failure monitoring
# RA Section 8.2 – Operational signals
# RA Section 8.3 – Incident response
# Tools: LangFuse, Prometheus, Grafana, OpenTelemetry Collector,
#        Evidently AI (drift), PagerDuty, Slack webhooks
# Schedule: Every 30 min (health probes), daily (drift & quality sampling)
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Health probe every 30 minutes
    - cron: "*/30 * * * *"
    # Full quality sampling daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Check mode"
        required: true
        default: "health"
        type: choice
        options: [health, quality-sample, drift, incident-replay, full]

permissions:
  contents: read
  issues:   write
  id-token: write

env:
  PYTHON_VERSION: "3.11"
  LLM_PROVIDER:  ${{ vars.DEFAULT_LLM_PROVIDER || 'openai' }}
  MODE:          ${{ inputs.mode || 'health' }}

jobs:
  # ──────────────────────────────────────────────────────
  # Job 1 – Latency & error rate probes
  # Tool: Prometheus query API, custom probe runner
  # RA Section 8.2 – p50/p95/p99 latency, error rates
  # ──────────────────────────────────────────────────────
  latency-health-probe:
    name: "Latency & Error Rate Health Probe"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure (OIDC)
        if: vars.CLOUD_PROVIDER == 'azure'
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to AWS (OIDC)
        if: vars.CLOUD_PROVIDER == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install monitoring dependencies
        run: pip install prometheus-client requests rich pagerduty-api-client

      - name: Query Prometheus operational signals
        run: |
          python scripts/monitoring/probe_latency.py \
            --prometheus-url "${{ vars.PROMETHEUS_URL }}" \
            --slo-config     config/slos.yaml \
            --output         reports/latency-probe.json
        env:
          PROMETHEUS_BEARER: ${{ secrets.PROMETHEUS_BEARER }}

      - name: Check SLO thresholds
        id: slo-check
        run: |
          python scripts/check_thresholds.py \
            --report reports/latency-probe.json \
            --gates  config/thresholds/production-slo.yaml \
            --output reports/slo-breach.json \
            --no-fail   # detect but don't fail CI; alert separately

          BREACHED=$(python -c "import json; d=json.load(open('reports/slo-breach.json')); print(d.get('has_breach', False))")
          echo "has_breach=$BREACHED" >> $GITHUB_OUTPUT

      - name: Alert via PagerDuty on SLO breach
        if: steps.slo-check.outputs.has_breach == 'True'
        run: |
          python scripts/monitoring/alert_pagerduty.py \
            --report    reports/slo-breach.json \
            --severity  critical \
            --source    "GitHub Actions – Production Monitor"
        env:
          PAGERDUTY_API_KEY:        ${{ secrets.PAGERDUTY_API_KEY }}
          PAGERDUTY_SERVICE_ID:     ${{ vars.PAGERDUTY_SERVICE_ID }}

      - name: Alert via Slack on SLO breach
        if: steps.slo-check.outputs.has_breach == 'True'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": ":rotating_light: *Production SLO Breach Detected*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *AI App Production SLO Breach*\nEnvironment: `${{ vars.CLOUD_PROVIDER }}`\nProvider: `${{ env.LLM_PROVIDER }}`\nSHA: `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Upload latency probe report
        uses: actions/upload-artifact@v4
        with:
          name: latency-probe-${{ github.run_id }}
          path: reports/latency-probe.json
          retention-days: 30

  # ──────────────────────────────────────────────────────
  # Job 2 – Production trace quality sampling
  # Tool: LangFuse + DeepEval (sampled groundedness check)
  # RA Section 8.1 – Trace structure; 8.2 – quality samples
  # Runs: Daily
  # ──────────────────────────────────────────────────────
  trace-quality-sampling:
    name: "Production Trace Quality Sampling (LangFuse)"
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '0 6 * * *' || inputs.mode == 'quality-sample' || inputs.mode == 'full' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install LangFuse + DeepEval
        run: pip install langfuse deepeval langchain-openai langchain-anthropic rich mlflow

      - name: Resolve LLM credentials (judge)
        run: |
          if [ "${{ env.LLM_PROVIDER }}" = "azure_openai" ]; then
            echo "AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }}" >> $GITHUB_ENV
            echo "AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY }}"   >> $GITHUB_ENV
          elif [ "${{ env.LLM_PROVIDER }}" = "anthropic" ]; then
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"         >> $GITHUB_ENV
          else
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"               >> $GITHUB_ENV
          fi

      - name: Sample and evaluate recent traces from LangFuse
        run: |
          python scripts/monitoring/sample_traces.py \
            --langfuse-host   "${{ vars.LANGFUSE_HOST }}" \
            --sample-rate     0.05 \
            --lookback-hours  24 \
            --judge-provider  ${{ env.LLM_PROVIDER }} \
            --output          reports/trace-quality-sample.json
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST:       ${{ vars.LANGFUSE_HOST }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_TOKEN: ${{ secrets.MLFLOW_TRACKING_TOKEN }}

      - name: Flag quality regressions for review queue
        run: |
          python scripts/monitoring/flag_regressions.py \
            --sample    reports/trace-quality-sample.json \
            --threshold config/thresholds/quality-sample.yaml \
            --output    reports/regression-candidates.json

      - name: Notify review queue via Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload-file-path: reports/regression-candidates.json
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_REVIEW_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Upload trace quality report
        uses: actions/upload-artifact@v4
        with:
          name: trace-quality-sample-${{ github.run_id }}
          path: reports/trace-quality-sample.json
          retention-days: 30

  # ──────────────────────────────────────────────────────
  # Job 3 – Model / corpus drift detection
  # Tool: Evidently AI (data drift + prediction drift)
  # RA Section 8.2 – "provider/corpus drift"
  # Runs: Daily
  # ──────────────────────────────────────────────────────
  drift-detection:
    name: "Model & Corpus Drift Detection (Evidently)"
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '0 6 * * *' || inputs.mode == 'drift' || inputs.mode == 'full' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure (OIDC)
        if: vars.CLOUD_PROVIDER == 'azure'
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to AWS (OIDC)
        if: vars.CLOUD_PROVIDER == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Evidently + dependencies
        run: pip install evidently mlflow pandas rich

      - name: Fetch recent inference traces for drift analysis
        run: |
          python scripts/monitoring/fetch_trace_metrics.py \
            --langfuse-host    "${{ vars.LANGFUSE_HOST }}" \
            --lookback-days    7 \
            --output           reports/recent-traces.parquet
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}

      - name: Run Evidently drift report
        run: |
          python scripts/monitoring/run_drift_report.py \
            --reference  evals/datasets/golden_set.jsonl \
            --current    reports/recent-traces.parquet \
            --output     reports/drift-report.html \
            --json-output reports/drift-metrics.json
        env:
          MLFLOW_TRACKING_URI:   ${{ vars.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_TOKEN: ${{ secrets.MLFLOW_TRACKING_TOKEN }}

      - name: Check drift thresholds and alert
        run: |
          python scripts/check_thresholds.py \
            --report reports/drift-metrics.json \
            --gates  config/thresholds/drift.yaml \
            --output reports/drift-breach.json \
            --no-fail

          DRIFTED=$(python -c "import json; d=json.load(open('reports/drift-breach.json')); print(d.get('has_breach', False))")
          if [ "$DRIFTED" = "True" ]; then
            python scripts/monitoring/alert_pagerduty.py \
              --report   reports/drift-breach.json \
              --severity warning \
              --source   "GitHub Actions – Drift Monitor"
          fi
        env:
          PAGERDUTY_API_KEY:    ${{ secrets.PAGERDUTY_API_KEY }}
          PAGERDUTY_SERVICE_ID: ${{ vars.PAGERDUTY_SERVICE_ID }}

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_id }}
          path: |
            reports/drift-report.html
            reports/drift-metrics.json
          retention-days: 30

  # ──────────────────────────────────────────────────────
  # Job 4 – Incident replay & regression promotion
  # RA Section 8.3 – "add reviewed regression case"
  # ──────────────────────────────────────────────────────
  incident-replay:
    name: "Incident Replay & Regression Case Promotion"
    runs-on: ubuntu-latest
    if: ${{ inputs.mode == 'incident-replay' || inputs.mode == 'full' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install "dvc[azure,s3]" langsmith mlflow rich

      - name: Replay confirmed incident traces
        run: |
          python scripts/monitoring/replay_incidents.py \
            --incidents-dir  evals/datasets/confirmed-incidents/ \
            --output         reports/incident-replay-results.json
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}

      - name: Promote confirmed incidents to regression dataset
        run: |
          python scripts/monitoring/promote_to_regression.py \
            --replay-results  reports/incident-replay-results.json \
            --dataset-path    evals/datasets/historical_failures.jsonl \
            --dvc-remote      origin
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}

      - name: Commit updated regression dataset
        run: |
          git config --global user.email "ci@github-actions"
          git config --global user.name  "GitHub Actions"
          dvc push
          git add evals/datasets/historical_failures.dvc
          git diff --staged --quiet || git commit \
            -m "chore: promote incidents to regression dataset [skip ci]" \
            -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push

      - name: Upload replay results
        uses: actions/upload-artifact@v4
        with:
          name: incident-replay-${{ github.run_id }}
          path: reports/incident-replay-results.json
          retention-days: 90

  # ──────────────────────────────────────────────────────
  # Job 5 – Grafana dashboard sync
  # Ensures dashboard JSON is in sync with production
  # Tool: Grafana API + custom provisioner
  # ──────────────────────────────────────────────────────
  sync-grafana-dashboards:
    name: "Sync Grafana Dashboards"
    runs-on: ubuntu-latest
    if: ${{ inputs.mode == 'full' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Grafana API client
        run: pip install grafana-api rich

      - name: Provision Grafana dashboards from JSON
        run: |
          python scripts/monitoring/sync_grafana.py \
            --dashboards-dir monitoring/grafana/dashboards/ \
            --grafana-url    "${{ vars.GRAFANA_URL }}"
        env:
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
